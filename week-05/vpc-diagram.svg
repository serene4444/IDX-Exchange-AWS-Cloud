<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="1100" height="720" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Week 05 — training-vpc (us-east-2)</text>

  <!-- Laptop + Internet -->
  <rect x="40" y="70" width="170" height="64" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="125" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">My laptop</text>
  <text x="125" y="118" text-anchor="middle" font-size="12" fill="#4b5563">my home IP</text>

  <ellipse cx="465" cy="102" rx="110" ry="32" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="465" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">Internet</text>

  <!-- VPC -->
  <rect x="30" y="170" width="1040" height="520" rx="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
  <text x="50" y="196" font-size="15" font-weight="700" fill="#5b21b6">VPC training-vpc · 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="405" y="152" width="120" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="465" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Internet Gateway</text>

  <!-- AZ columns -->
  <rect x="55" y="215" width="480" height="455" rx="10" fill="none" stroke="#9ca3af" stroke-dasharray="6 5"/>
  <text x="70" y="236" font-size="13" font-weight="600" fill="#4b5563">AZ us-east-2a</text>
  <rect x="565" y="215" width="480" height="455" rx="10" fill="none" stroke="#9ca3af" stroke-dasharray="6 5"/>
  <text x="580" y="236" font-size="13" font-weight="600" fill="#4b5563">AZ us-east-2b</text>

  <!-- Public subnets -->
  <rect x="75" y="250" width="440" height="160" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="90" y="272" font-size="13" font-weight="700" fill="#065f46">Public subnet 1 · 10.0.0.0/20</text>
  <text x="90" y="290" font-size="11" fill="#047857">route table: 10.0.0.0/16 → local · 0.0.0.0/0 → IGW</text>
  <rect x="585" y="250" width="440" height="160" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="272" font-size="13" font-weight="700" fill="#065f46">Public subnet 2 · 10.0.16.0/20</text>
  <text x="600" y="290" font-size="11" fill="#047857">route table: 10.0.0.0/16 → local · 0.0.0.0/0 → IGW</text>
  <text x="805" y="350" text-anchor="middle" font-size="12" fill="#6b7280">(reserved for Week 6 ALB)</text>

  <!-- Bastion -->
  <rect x="95" y="310" width="190" height="82" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="190" y="333" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Bastion (t3.micro)</text>
  <text x="190" y="351" text-anchor="middle" font-size="11" fill="#374151">public IP 18.224.33.2</text>
  <text x="190" y="367" text-anchor="middle" font-size="11" fill="#374151">bastion-sg: 22 ← my IP/32</text>

  <!-- NAT -->
  <rect x="315" y="310" width="180" height="82" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="405" y="333" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">NAT Gateway</text>
  <text x="405" y="351" text-anchor="middle" font-size="11" fill="#374151">Elastic IP 77.114.32.11</text>
  <text x="405" y="367" text-anchor="middle" font-size="11" fill="#374151">outbound only</text>

  <!-- Private subnets -->
  <rect x="75" y="440" width="440" height="210" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="462" font-size="13" font-weight="700" fill="#1e3a8a">Private subnet 1 · 10.0.128.0/20</text>
  <text x="90" y="480" font-size="11" fill="#1d4ed8">route table: 10.0.0.0/16 → local · 0.0.0.0/0 → NAT</text>
  <rect x="585" y="440" width="440" height="210" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="462" font-size="13" font-weight="700" fill="#1e3a8a">Private subnet 2 · 10.0.144.0/20</text>
  <text x="600" y="480" font-size="11" fill="#1d4ed8">route table: 10.0.0.0/16 → local · 0.0.0.0/0 → NAT</text>

  <!-- Private instance -->
  <rect x="95" y="540" width="210" height="88" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="200" y="563" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Private instance (t3.micro)</text>
  <text x="200" y="581" text-anchor="middle" font-size="11" fill="#374151">10.0.136.146 · no public IP</text>
  <text x="200" y="597" text-anchor="middle" font-size="11" fill="#374151">private-sg: 22 ← bastion-sg</text>

  <!-- SSH path (black) -->
  <path d="M210,102 L355,102" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M440,133 L455,150" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M430,188 C380,240 260,260 205,308" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M175,392 L175,538" stroke="#1f2937" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="185" y="515" font-size="11" font-weight="600" fill="#1f2937">SSH hop (local route)</text>

  <!-- Outbound path (amber) -->
  <path d="M307,580 C370,540 400,450 405,394" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" fill="none" marker-end="url(#g)"/>
  <path d="M440,308 C470,260 490,215 480,190" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" fill="none" marker-end="url(#g)"/>

  <!-- Legend -->
  <rect x="640" y="530" width="370" height="100" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <line x1="660" y1="557" x2="700" y2="557" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="712" y="561" font-size="12" fill="#111827">SSH: laptop → IGW → bastion → private</text>
  <line x1="660" y1="583" x2="700" y2="583" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#g)"/>
  <text x="712" y="587" font-size="12" fill="#111827">Outbound: private → NAT → IGW → internet</text>
  <text x="660" y="612" font-size="12" fill="#6b7280">Security groups are stateful: replies flow back</text>
</svg>
